<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Puttipeli – renderöintiharjoitus</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #1b2230; color: #e8ecf2; font: 14px system-ui, sans-serif; }
      body { display: flex; flex-direction: column; min-height: 100%; }
      header { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; background: #243043; border-bottom: 1px solid #36465f; }
      header h1 { font-size: 15px; margin: 0 12px 0 0; font-weight: 600; }
      button, select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid #4a5f80; background: #2f3f58; color: inherit; cursor: pointer; }
      button:hover { background: #3a4d6b; }
      label { display: inline-flex; gap: 6px; align-items: center; }
      #status { margin-left: auto; opacity: 0.8; font-variant-numeric: tabular-nums; }
      main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; min-height: 0; overflow: auto; }
      #stage { width: 100%; height: 100%; min-height: 405px; display: flex; align-items: center; justify-content: center; }
      #stage.fixed1 { width: 765px; height: 405px; flex: none; }
      #stage.fixed2 { width: 1530px; height: 810px; flex: none; }
      footer { display: flex; gap: 16px; align-items: flex-start; padding: 8px 12px; border-top: 1px solid #36465f; background: #243043; font-size: 12px; }
      footer canvas { image-rendering: auto; border: 1px solid #36465f; background: #000; }
      #log { flex: 1; max-height: 72px; overflow: auto; white-space: pre-wrap; opacity: 0.85; font-family: ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <header>
      <h1>Puttipeli · renderöintiharjoitus</h1>
      <button id="btnDemo">Esittelylyönnit</button>
      <button id="btnShot">Satunnainen lyönti</button>
      <button id="btnFast">Pikakelaus</button>
      <button id="btnReset">Nollaa rata</button>
      <label><input type="checkbox" id="chkEditor" /> Editoritila</label>
      <label><input type="checkbox" id="chkFx" checked /> Tehosteet</label>
      <label><input type="checkbox" id="chkSound" /> Äänet</label>
      <label>Koko
        <select id="selSize">
          <option value="fit" selected>Sovita ikkunaan</option>
          <option value="fixed1">1x (765×405)</option>
          <option value="fixed2">2x (1530×810)</option>
        </select>
      </label>
      <span id="status"></span>
    </header>
    <main><div id="stage"></div></main>
    <footer>
      <div>Pienoiskuvat<br /><canvas id="thumb1"></canvas> <canvas id="thumb2"></canvas></div>
      <div id="log"></div>
    </footer>
    <script type="module" src="./render.ts"></script>
  </body>
</html>
